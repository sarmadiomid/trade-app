# Production stack (VPS deploy uses this via `docker compose up`).
# Expects shared MongoDB on the external Docker network `infra`.
# Local hot-reload + local Mongo:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
#   cp .env.example .env   # set AUTH_SECRET and MONGODB_URI

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tradingchart:latest
    ports:
      - "${BIND:-127.0.0.1:3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Hostname must resolve on the shared `infra` network (e.g. mongo / mongodb).
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-tradingchart}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
      MEDIANA_API_KEY: ${MEDIANA_API_KEY:-}
      MEDIANA_PATTERN_CODE: ${MEDIANA_PATTERN_CODE:-}
    networks:
      - infra
    restart: unless-stopped

  # Historical m1 candles: 3y bootstrap then 12h incremental refresh via dukascopy-node.
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest
    image: tradingchart-ingest:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-tradingchart}
      DUKASCOPY_CACHE_PATH: /data/.dukascopy-cache
      INGEST_BOOTSTRAP_YEARS: ${INGEST_BOOTSTRAP_YEARS:-3}
      INGEST_INTERVAL_MS: ${INGEST_INTERVAL_MS:-43200000}
      INGEST_OVERLAP_MS: ${INGEST_OVERLAP_MS:-172800000}
    volumes:
      - dukascopy-cache:/data/.dukascopy-cache
    networks:
      - infra
    restart: unless-stopped

networks:
  infra:
    external: true
    name: infra

volumes:
  dukascopy-cache:
