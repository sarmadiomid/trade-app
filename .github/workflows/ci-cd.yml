# Lint/test/build on PR/push; deploy to VPS on push to development (or workflow_dispatch).
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH
# Optional: VPS_SSH_PORT (default 22)

name: CI/CD

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: trade-app-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run check

      - name: Build Next.js
        run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder

  compose-config:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          cat > .env <<'EOF'
          AUTH_SECRET=ci
          MONGODB_URI=mongodb://mongo:27017
          EOF
          docker compose config -q

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: compose-config
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin development
            git checkout development
            git pull --ff-only origin development
            docker compose up -d --build --remove-orphans
            docker compose ps
